<article class="pcard" [attr.data-id]="product().id" [attr.data-cat]="product().category">
  <a class="pcard__stage" [routerLink]="['/product', product().id]" [attr.aria-label]="i18n.copy(product()).name">
    <!-- Wishlist heart -->
    <button
      class="wishlist-btn"
      [class.is-active]="isInWishlist"
      (click)="toggleWishlist($event)"
      aria-label="Wishlist"
    >
      <svg viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </button>

    @if (product().badge; as badge) {
      <span class="pcard__badge pcard__badge--{{ badge }}">{{ badgeLabel() }}</span>
    }
    <img class="pcard__img" [src]="imgSrc(product().id)" [alt]="i18n.copy(product()).name" data-fallback loading="lazy">
    <span class="pcard__quick">
      <span class="btn btn--green btn--sm btn--full" (click)="add($event)">{{ i18n.t('pdp.add') }}</span>
    </span>
  </a>
  <div class="pcard__body">
    <span class="pcard__cat">{{ categoryName() }}</span>
    <h3 class="pcard__name"><a [routerLink]="['/product', product().id]">{{ i18n.copy(product()).name }}</a></h3>
    <div class="pcard__price">
      @if (product().oldPrice; as old) {
        <del>{{ i18n.money(old) }}</del>
        <ins>{{ i18n.money(product().price) }}</ins>
      } @else {
        <ng-container>{{ i18n.money(product().price) }}</ng-container>
      }
    </div>
  </div>
</article>
