<div class="login-page">
  <div class="login-card">
    <!-- Left: Brand / Image -->
    <div class="login-banner">
      <div class="banner-content">
        <h2 class="banner-title">Welcome Back</h2>
        <p class="banner-sub">Sign in to access your orders and personalised recommendations.</p>
        <div class="banner-image">
          <!-- Replace with your product image -->
          <img src="assets/img/banner-login.png" alt="Beauté Pro" />
        </div>
      </div>
    </div>

    <!-- Right: Forms -->
    <div class="login-forms">
      <div class="form-header">
        <h1>{{ isLoginMode ? 'Sign In' : 'Create Account' }}</h1>
        <p class="form-toggle">
          {{ isLoginMode ? "Don't have an account?" : "Already have an account?" }}
          <button type="button" class="toggle-link" (click)="toggleMode()">
            {{ isLoginMode ? 'Sign Up' : 'Sign In' }}
          </button>
        </p>
      </div>

      <!-- Error message -->
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <!-- Login Form -->
      <form *ngIf="isLoginMode" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" formControlName="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" formControlName="password" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn--gold btn--full" [disabled]="isLoading">
          {{ isLoading ? 'Signing in...' : 'Sign In' }}
        </button>
        <div class="divider">or</div>
        <button type="button" class="btn btn--google" (click)="googleLogin()">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
      </form>

      <!-- Register Form -->
      <form *ngIf="!isLoginMode" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input id="reg-name" type="text" formControlName="full_name" placeholder="John Doe" />
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" formControlName="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="reg-phone">Phone (optional)</label>
          <input id="reg-phone" type="tel" formControlName="phone" placeholder="+92-300-1234567" />
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" formControlName="password" placeholder="••••••••" />
        </div>
        <div class="form-group">
          <label for="reg-address">Address (optional)</label>
          <input id="reg-address" type="text" formControlName="address" placeholder="City, Country" />
        </div>
        <button type="submit" class="btn btn--gold btn--full" [disabled]="isLoading">
          {{ isLoading ? 'Creating account...' : 'Create Account' }}
        </button>
        <div class="divider">or</div>
        <button type="button" class="btn btn--google" (click)="googleLogin()">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
      </form>
    </div>
  </div>
</div>
