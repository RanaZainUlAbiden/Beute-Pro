<div class="dropdown-container" #dropdownContainer>
  <!-- Trigger Button -->
  <button class="profile-trigger" (click)="toggle()" [attr.aria-expanded]="isOpen" aria-label="User menu">
    <span class="avatar">{{ getInitials() }}</span>
    <span class="user-name">{{ user?.full_name || 'Account' }}</span>
    <svg class="chevron" viewBox="0 0 24 24" [class.is-open]="isOpen">
      <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none"/>
    </svg>
  </button>

  <!-- Dropdown Panel -->
  <div class="dropdown-panel" [class.is-open]="isOpen">
    <!-- User Info -->
    <div class="dropdown-header">
      <div class="avatar-large">{{ getInitials() }}</div>
      <div class="user-info">
        <div class="user-name-full">{{ user?.full_name || 'User' }}</div>
        <div class="user-email">{{ user?.email || '' }}</div>
        <div *ngIf="user?.phone" class="user-phone">{{ user?.phone }}</div>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Menu Items -->
    <div class="dropdown-menu">
      <button class="menu-item" (click)="goToProfile()">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        <span>Profile Settings</span>
      </button>

      <button class="menu-item" (click)="goToOrders()">
        <svg viewBox="0 0 24 24"><path d="M6 7h12l-1.2 12H7.2z" stroke="currentColor" stroke-width="2" fill="none"/><path d="M9 7a3 3 0 0 1 6 0" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        <span>My Orders</span>
      </button>

      <div class="divider"></div>

      <button class="menu-item menu-item--danger" (click)="logout()">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" fill="none"/><polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="2" fill="none"/><line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2"/></svg>
        <span>Logout</span>
      </button>
    </div>
  </div>
</div>
